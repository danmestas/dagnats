name: Race

# ci.yml's Test step runs `go test ./...` without -race, so a data race
# only surfaces if a human happens to run the detector locally (#667:
# a race in connect_owned_race_test.go merged silently and was only
# caught by a reviewer). This job runs -race over the concurrency-heavy
# packages — bridge, worker, engine, api, workertoken, natsutil, journal — where
# heartbeat loops, ordered consumers, CAS retry loops, and SSE fan-out
# make races most likely. The full embedded E2E suite is skipped here
# (see ci.yml's Test step) to keep this job's runtime bounded.
#
# Each package runs as its own matrix job (#815). In one `go test`
# command the six packages shared one runner's cores, and the engine
# package alone (365 tests, run serially, ~213s under -race on a quiet
# laptop) left the whole job at 4m57s of its 300s budget. Separate
# jobs give each package a full runner; the 300s per-package timeout
# is unchanged.

on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - '.github/workflows/race.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - '.github/workflows/race.yml'

permissions:
  contents: read

jobs:
  race:
    name: race detector (${{ matrix.pkg }}${{ matrix.shard != '' && format(' {0}/3', matrix.shard) || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg:
          - ./bridge/
          - ./worker/
          - ./internal/api/
          - ./internal/workertoken/
          - ./internal/natsutil/
          - ./journal/
        shard: ['']
        include:
          # internal/engine runs its tests serially; three shards keep
          # each job well inside the 300s timeout (scripts/race-shard.sh).
          - pkg: ./internal/engine/
            shard: '0'
          - pkg: ./internal/engine/
            shard: '1'
          - pkg: ./internal/engine/
            shard: '2'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Race detector
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            ./scripts/race-shard.sh ${{ matrix.pkg }} ${{ matrix.shard }} 3
          else
            go test -race -count=1 -timeout 300s ${{ matrix.pkg }}
          fi
        env:
          E2E_TOPOLOGY: embedded
