name: Release dagnats-mcp-duckdb

# Builds the four dagnats-mcp-duckdb release tarballs (linux/{amd64,arm64},
# darwin/{amd64,arm64}) when a release tag is pushed. The linux builds run
# on ubuntu (Docker-based, qemu for arm64) and the darwin builds run on
# macos-latest (native arm64 + cross-compile to amd64 via clang -arch). The
# darwin job is intentionally a single runner to keep macOS minutes low —
# see #188 PR 6b for the cost-control rationale.
#
# On a tag push the `publish` job attaches the tarballs to the matching
# GitHub release. It used to stop at workflow artifacts and rely on the
# operator attaching them by hand; that step was never performed, so no
# release from v0.0.1 through v0.0.13 shipped a dagnats-mcp-duckdb asset
# and `dagnats sidecar install` 404'd on every one of them (#621).
# `make release` would have globbed them in, but releases are cut via
# `make build-release` + `gh release upload`, which does not build them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  linux:
    name: linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU for cross-arch
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        run: make build-mcp-duckdb-linux-${{ matrix.arch }}

      - name: Smoke-test
        # Verify the tarball extracts and the binary's --help exits 0 on a
        # clean ubuntu:24.04 host. ldd output is captured for the audit log
        # so a future libstdc++ drift shows up clearly.
        run: |
          set -eu
          PKG="dagnats-mcp-duckdb-linux-${{ matrix.arch }}"
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD/dist:/dist" ubuntu:24.04 sh -c "
              set -eu
              cd /tmp
              tar xzf /dist/${PKG}.tar.gz
              cd ${PKG}
              ldd ./dagnats-mcp-duckdb
              ./dagnats-mcp-duckdb --help
            "

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dagnats-mcp-duckdb-linux-${{ matrix.arch }}
          path: |
            dist/dagnats-mcp-duckdb-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # Single macOS runner builds both darwin slices via clang -arch.
  # macos-latest is arm64; darwin/arm64 builds natively, darwin/amd64
  # cross-compiles. One runner keeps macOS minutes low — see #188 PR 6b.
  darwin:
    name: darwin/{amd64,arm64}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build darwin/arm64
        run: make build-mcp-duckdb-darwin-arm64

      - name: Smoke-test darwin/arm64
        run: |
          set -eu
          PKG="dagnats-mcp-duckdb-darwin-arm64"
          cd /tmp
          tar xzf "$GITHUB_WORKSPACE/dist/${PKG}.tar.gz"
          cd "${PKG}"
          otool -L ./dagnats-mcp-duckdb
          ./dagnats-mcp-duckdb --help

      - name: Build darwin/amd64
        run: make build-mcp-duckdb-darwin-amd64

      - name: Smoke-test darwin/amd64
        # macos-latest runners support running x86_64 binaries via Rosetta;
        # if that's unavailable on a future runner image, fall through to
        # otool -L only (which still verifies the binary is well-formed and
        # links only against system libs).
        run: |
          set -eu
          PKG="dagnats-mcp-duckdb-darwin-amd64"
          cd /tmp
          rm -rf "${PKG}"
          tar xzf "$GITHUB_WORKSPACE/dist/${PKG}.tar.gz"
          cd "${PKG}"
          otool -L ./dagnats-mcp-duckdb
          if arch -x86_64 true 2>/dev/null; then
            arch -x86_64 ./dagnats-mcp-duckdb --help
          else
            echo "Rosetta unavailable on this runner; skipping --help exec"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dagnats-mcp-duckdb-darwin
          path: |
            dist/dagnats-mcp-duckdb-darwin-amd64.tar.gz
            dist/dagnats-mcp-duckdb-darwin-arm64.tar.gz
          if-no-files-found: error

  # Attach the built tarballs to the GitHub release for this tag.
  # Only runs on tag pushes — a workflow_dispatch build has no release
  # to publish to and stops at workflow artifacts.
  publish:
    name: publish to release
    needs: [linux, darwin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built tarballs
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        # Named separately from the release's own SHA256SUMS (written by
        # `make build-release`) so uploading does not clobber it.
        run: |
          set -eu
          cd artifacts
          ls -la
          shasum -a 256 dagnats-mcp-duckdb-*.tar.gz > SHA256SUMS-mcp-duckdb
          cat SHA256SUMS-mcp-duckdb

      - name: Wait for the release to exist
        # The tag push fires this workflow, but the release itself is
        # created by the operator's `gh release create`. Poll rather than
        # assume an ordering. Bounded: 30 tries x 20s = 10 minutes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $TAG exists"
              exit 0
            fi
            echo "attempt $i/30: release $TAG not published yet, waiting 20s"
            sleep 20
          done
          echo "::error::release $TAG never appeared; assets not attached."
          echo "Re-run this workflow once the release is published."
          exit 1

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" \
            artifacts/dagnats-mcp-duckdb-*.tar.gz \
            artifacts/SHA256SUMS-mcp-duckdb \
            --repo "$GITHUB_REPOSITORY" --clobber
          n=$(find artifacts -name 'dagnats-mcp-duckdb-*.tar.gz' | wc -l)
          echo "attached $n tarballs to $TAG"
